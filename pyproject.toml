[project]
name = "the-cursed-tomb"
version = "0.1.0"
description = "The Cursed Tomb — Pyramid Solitaire (web game, PDF rulebook, and Python simulations)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.7",
    "Pillow>=10",
    "pyyaml>=6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "jupyter>=1.0",
    "notebook>=7.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[tool.uv]
managed = true
